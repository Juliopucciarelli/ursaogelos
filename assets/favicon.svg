<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Eixo vertical -->
  <line x1="32" y1="4" x2="32" y2="60" stroke="#009FE3" stroke-width="5" stroke-linecap="round"/>
  <!-- Eixo horizontal -->
  <line x1="4" y1="32" x2="60" y2="32" stroke="#009FE3" stroke-width="5" stroke-linecap="round"/>
  <!-- Diagonal 1 -->
  <line x1="9" y1="9" x2="55" y2="55" stroke="#009FE3" stroke-width="5" stroke-linecap="round"/>
  <!-- Diagonal 2 -->
  <line x1="55" y1="9" x2="9" y2="55" stroke="#009FE3" stroke-width="5" stroke-linecap="round"/>
  <!-- Pontas eixo vertical -->
  <polyline points="24,12 32,4 40,12" stroke="#009FE3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polyline points="24,52 32,60 40,52" stroke="#009FE3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Pontas eixo horizontal -->
  <polyline points="12,24 4,32 12,40" stroke="#009FE3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polyline points="52,24 60,32 52,40" stroke="#009FE3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Ramificações eixo vertical -->
  <line x1="32" y1="20" x2="24" y2="28" stroke="#009FE3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="40" y2="28" stroke="#009FE3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="24" y2="36" stroke="#009FE3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="40" y2="36" stroke="#009FE3" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Ramificações eixo horizontal -->
  <line x1="20" y1="32" x2="28" y2="24" stroke="#009FE3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="28" y2="40" stroke="#009FE3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="36" y2="24" stroke="#009FE3" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="36" y2="40" stroke="#009FE3" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Centro -->
  <circle cx="32" cy="32" r="5" fill="#009FE3"/>
</svg>
